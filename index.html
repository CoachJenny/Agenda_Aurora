<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080720">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Auror-Agenda">
  <link rel="icon" type="image/png" href="./icons/favicon.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap">
  <meta name="description" content="Auror-Agenda, le planner qui ne te juge pas. Par Nahara.">
  <title>Auror-Agenda · Nahara</title>
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <p class="brand"><a href="#" id="home">Auror-<em>Agenda</em></a></p>
        <div class="date" id="today"></div>
      </div>
      <button class="iconbtn" id="settings" type="button" aria-label="Réglages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
      </button>
    </header>
    <main id="view"></main>
  </div>

  <div class="pulse"><div class="in">
    <button class="pbtn flow" id="pFlow" type="button"></button>
    <button class="pbtn procra" id="pProcra" type="button"></button>
    <button class="pbtn wbb" id="pWb" type="button"><span class="ic">❀</span>Bien-être</button>
  </div></div>

  <nav class="tabs"><div class="in">
    <button type="button" data-tab="accueil"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="4"/><path d="M12 3.5v2.5M4.5 13H2.5M21.5 13h-2M5.8 6.8l1.6 1.6M18.2 6.8l-1.6 1.6M4 20h16"/></svg>Aujourd'hui</button>
    <button type="button" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Planifier</button>
    <button type="button" data-tab="journee"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="7" height="16" rx="2" stroke-dasharray="2.5 2"/><rect x="13.5" y="4" width="7" height="16" rx="2"/></svg>Ma journée</button>
    <button type="button" data-tab="synthese"><svg viewBox="0 0 24 24"><path d="M3 18c3-6 5-9 8-4s5 2 10-6"/><circle cx="8" cy="7" r="1.5"/><circle cx="17" cy="16" r="1.5"/></svg>Synthèse</button>
  </div></nav>

  <div id="sheetWrap" hidden><div class="scrim" id="scrim"></div><div class="sheet"><div class="in" id="sheet" role="dialog" aria-modal="true"></div></div></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
